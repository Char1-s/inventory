<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>간편 재고조사 스캐너</title>
    <!-- ZXing 바코드/QR코드 디코더 라이브러리 -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        header {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 1.3rem;
            color: #f5f5f7;
        }
        /* 뷰파인더 스타일 */
        .viewfinder-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scan-guide {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scan-box {
            width: 75%;
            height: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 10px;
        }
        .overlay-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
            width: 90%;
            pointer-events: none;
        }
        /* 에러 메시지 배너 */
        .error-banner {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid #ff3b30;
            color: #ff453a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            word-break: break-all;
        }
        /* 버튼 그리드 */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background-color: #007aff; color: white; }
        .btn-primary:active { background-color: #0056b3; }
        .btn-success { background-color: #34c759; color: white; }
        .btn-success:active { background-color: #289e46; }
        button:disabled { background-color: #2c2c2e; color: #555; cursor: not-allowed; }

        /* 수동 입력 영역 */
        .manual-input-box {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #3a3a3c;
            background-color: #1c1c1e;
            color: white;
            font-size: 0.95rem;
        }
        .btn-add {
            background-color: #af52de;
            color: white;
            padding: 0 16px;
        }

        /* 재고 리스트 영역 */
        .inventory-section {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #8e8e93;
            border-bottom: 1px solid #2c2c2e;
            padding-bottom: 8px;
        }
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item-card {
            background-color: #2c2c2e;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            word-break: break-all;
            max-width: 60%;
        }
        .item-code {
            font-weight: 700;
            font-size: 0.95rem;
            color: #30d158;
        }
        .item-time {
            font-size: 0.75rem;
            color: #8e8e93;
        }
        .item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            background-color: #3a3a3c;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 0.9rem;
        }
        .item-qty {
            font-weight: bold;
            font-size: 1rem;
            min-width: 24px;
            text-align: center;
        }
        .del-btn {
            background-color: rgba(255, 59, 48, 0.2);
            color: #ff453a;
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
        }
        .empty-msg {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 20px 0;
        }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 간편 재고조사 스캐너</h1>
    </header>

    <!-- 에러 알림 -->
    <div id="errorBanner" class="error-banner"></div>

    <!-- 카메라 화면 -->
    <div class="viewfinder-wrapper">
        <video id="video" playsinline autoplay muted></video>
        <div class="scan-guide">
            <div class="scan-box"></div>
        </div>
        <div id="overlayMsg" class="overlay-msg">
            '카메라 시작' 버튼을 눌러주세요.
        </div>
    </div>

    <!-- 제어 버튼 -->
    <div class="controls-grid">
        <button id="startBtn" class="btn-primary" onclick="initScanner()">📷 카메라 시작</button>
        <button id="captureBtn" class="btn-success" onclick="captureAndScan()" disabled>📸 수동 스캔 촬영</button>
    </div>

    <!-- 직접 입력 박스 -->
    <div class="manual-input-box">
        <input type="text" id="manualInput" placeholder="바코드 번호 또는 품목명 직접 입력" onkeypress="if(event.key==='Enter') addItemManually()">
        <button class="btn-add" onclick="addItemManually()">추가</button>
    </div>

    <!-- 재고 조사 리스트 -->
    <div class="inventory-section">
        <div class="inventory-header">
            <span>조사된 품목 리스트</span>
            <span id="totalCount">총 수량: 0개</span>
        </div>
        <div id="itemList" class="item-list">
            <div class="empty-msg">스캔된 내역이 없습니다.</div>
        </div>
        <button style="background-color: #3a3a3c; color: #ff453a; margin-top: 5px;" onclick="clearInventory()">🗑️ 전체 리스트 초기화</button>
    </div>
</div>

<canvas id="captureCanvas"></canvas>

<script>
    let codeReader = null;
    let inventory = [];
    const video = document.getElementById('video');
    const overlayMsg = document.getElementById('overlayMsg');
    const errorBanner = document.getElementById('errorBanner');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const itemList = document.getElementById('itemList');
    const totalCount = document.getElementById('totalCount');

    // 페이지 로드 시 로컬스토리지에서 기존 데이터 불러오기
    window.onload = () => {
        const saved = localStorage.getItem('inventory_data');
        if (saved) {
            try { inventory = JSON.parse(saved); } catch(e) { inventory = []; }
        }
        renderInventory();
    };

    function saveAndRender() {
        localStorage.setItem('inventory_data', JSON.stringify(inventory));
        renderInventory();
    }

    function showError(msg) {
        errorBanner.style.display = 'block';
        errorBanner.innerText = msg;
    }

    // 카메라 시작 및 실시간 바코드 디코딩
    async function initScanner() {
        errorBanner.style.display = 'none';
        try {
            if (!codeReader) {
                codeReader = new ZXing.BrowserMultiFormatReader();
            }

            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                video.play();
                overlayMsg.style.display = 'none';
                startBtn.innerText = "카메라 재시작";
                captureBtn.disabled = false;
                
                // 실시간 스캔 시작
                startContinuousDecode();
            };
        } catch (err) {
            console.error(err);
            showError("카메라 에러: " + (err.message || err.name));
        }
    }

    // 실시간 자동 스캔
    function startContinuousDecode() {
        codeReader.decodeFromVideoElement(video, (result, err) => {
            if (result) {
                addOrUpdateItem(result.getText());
            }
        });
    }

    // 수동 캡처 및 스캔
    function captureAndScan() {
        if (!video.videoWidth) return;
        const canvas = document.getElementById('captureCanvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const img = new Image();
        img.src = canvas.toDataURL('image/png');
        img.onload = async () => {
            try {
                const result = await codeReader.decodeFromImageElement(img);
                if (result) {
                    addOrUpdateItem(result.getText());
                }
            } catch (e) {
                alert("촬영된 이미지에서 바코드를 찾지 못했습니다.");
            }
        };
    }

    // 수동 직접 추가
    function addItemManually() {
        const input = document.getElementById('manualInput');
        const val = input.value.trim();
        if (!val) return;
        addOrUpdateItem(val);
        input.value = '';
    }

    // 아이템 추가 또는 수량 증가 로직
    function addOrUpdateItem(code) {
        const existing = inventory.find(item => item.code === code);
        if (existing) {
            existing.qty += 1;
            existing.time = new Date().toLocaleTimeString();
        } else {
            inventory.unshift({
                code: code,
                qty: 1,
                time: new Date().toLocaleTimeString()
            });
        }
        
        // 진동 피드백 (지원 기기)
        if (navigator.vibrate) navigator.vibrate(80);
        saveAndRender();
    }

    // 수량 변경
    fnChangeQty = function(index, delta) {
        inventory[index].qty += delta;
        if (inventory[index].qty <= 0) {
            inventory.splice(index, 1);
        }
        saveAndRender();
    }

    // 아이템 삭제
    function removeItem(index) {
        inventory.splice(index, 1);
        saveAndRender();
    }

    // 전체 초기화
    function clearInventory() {
        if (confirm("정말 모든 재고 리스트를 초기화하시겠습니까?")) {
            inventory = [];
            saveAndRender();
        }
    }

    // 리스트 화면 렌더링
    function renderInventory() {
        if (inventory.length === 0) {
            itemList.innerHTML = `<div class="empty-msg">스캔된 내역이 없습니다.</div>`;
            totalCount.innerText = "총 수량: 0개";
            return;
        }

        let html = '';
        let totalQ = 0;
        inventory.forEach((item, idx) => {
            totalQ += item.qty;
            html += `
                <div class="item-card">
                    <div class="item-info">
                        <span class="item-code">${escapeHtml(item.code)}</span>
                        <span class="item-time">${item.time}</span>
                    </div>
                    <div class="item-controls">
                        <button class="qty-btn" onclick="fnChangeQty(${idx}, -1)">-</button>
                        <span class="item-qty">${item.qty}</span>
                        <button class="qty-btn" onclick="fnChangeQty(${idx}, 1)">+</button>
                        <button class="del-btn" onclick="removeItem(${idx})">삭제</button>
                    </div>
                </div>
            `;
        });
        itemList.innerHTML = html;
        totalCount.innerText = `총 수량: ${totalQ}개`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>
</body>
</html>
