<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>재고 관리 바코드 스캐너</title>
    <!-- ZXing 바코드/QR코드 전문 디코더 라이브러리 -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        header {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 1.3rem;
            color: #f5f5f7;
        }
        .viewfinder-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 스캔 가이드 레이저 레이어 */
        .scan-guide {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scan-box {
            width: 80%;
            height: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            position: relative;
        }
        .laser-line {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 2px;
            background: #ff3b30;
            box-shadow: 0 0 8px #ff3b30;
            animation: scan 2s infinite ease-in-out;
            display: none;
        }
        @keyframes scan {
            0% { top: 15%; }
            50% { top: 85%; }
            100% { top: 15%; }
        }
        .overlay-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-size: 0.95rem;
            text-align: center;
            width: 90%;
            pointer-events: none;
        }
        /* 에러 박스 */
        .error-banner {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid #ff3b30;
            color: #ff453a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            word-break: break-all;
        }
        /* 컨트롤 버튼들 */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background-color: #007aff; color: white; }
        .btn-primary:active { background-color: #0056b3; }
        .btn-success { background-color: #34c759; color: white; }
        .btn-success:active { background-color: #289e46; }
        .btn-secondary { background-color: #2c2c2e; color: #30d158; border: 1px solid #3a3a3c; }
        button:disabled { background-color: #2c2c2e; color: #555; cursor: not-allowed; border: none; }
        
        /* 줌/카메라 옵션 컨트롤 */
        .camera-tools {
            background-color: #1c1c1e;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
        }
        .tool-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        input[type=range] {
            width: 60%;
        }

        /* 스캔 결과 표시 영역 */
        .result-card {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            padding: 14px;
            margin-top: 5px;
        }
        .result-header {
            font-size: 0.75rem;
            color: #8e8e93;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .result-body {
            font-size: 1.1rem;
            font-weight: 700;
            color: #30d158;
            word-break: break-all;
        }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>재고 스캐너</h1>
    </header>

    <!-- 에러 메시지 알림 -->
    <div id="errorBanner" class="error-banner"></div>

    <!-- 비디오 스캐너 화면 -->
    <div class="viewfinder-wrapper">
        <video id="video" playsinline autoplay muted></video>
        <div class="scan-guide">
            <div class="scan-box">
                <div id="laser" class="laser-line"></div>
            </div>
        </div>
        <div id="overlayMsg" class="overlay-msg">
            아래 '카메라 시작' 버튼을 터치하여<br>스캐너를 활성화하세요.
        </div>
    </div>

    <!-- 기본 버튼 조작 -->
    <div class="controls-grid">
        <button id="startBtn" class="btn-primary" onclick="initScanner()">📷 카메라 시작</button>
        <button id="captureBtn" class="btn-success" onclick="manualCaptureAndScan()" disabled>📸 촬영 후 스캔</button>
    </div>

    <!-- 카메라 추가 도구 (플래시 / 줌) -->
    <div class="camera-tools">
        <div class="tool-row">
            <span>💡 플래시(Torch)</span>
            <button id="torchBtn" class="btn-secondary" onclick="toggleTorch()" disabled style="padding: 6px 12px; font-size: 0.8rem;">켜기</button>
        </div>
        <div class="tool-row">
            <span>🔍 Zoom</span>
            <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" disabled oninput="setZoom(this.value)">
        </div>
    </div>

    <!-- 인식 결과 출력 -->
    <div class="result-card">
        <div class="result-header">스캔 인식 결과</div>
        <div id="resultText" class="result-body">대기 중...</div>
    </div>
</div>

<canvas id="captureCanvas"></canvas>

<script>
    let codeReader = null;
    let videoTrack = null;
    let isScanning = false;
    let torchState = false;

    const video = document.getElementById('video');
    const overlayMsg = document.getElementById('overlayMsg');
    const laser = document.getElementById('laser');
    const errorBanner = document.getElementById('errorBanner');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const torchBtn = document.getElementById('torchBtn');
    const zoomRange = document.getElementById('zoomRange');
    const resultText = document.getElementById('resultText');

    // 에러 표시 기능
    function showError(msg) {
        errorBanner.style.display = 'block';
        errorBanner.innerText = msg;
    }
    function clearError() {
        errorBanner.style.display = 'none';
        errorBanner.innerText = '';
    }

    // 카메라 및 바코드 디코더 초기화 (터치 이벤트 기반)
    async function initScanner() {
        clearError();
        resultText.innerText = "카메라에 바코드를 맞춰주세요...";

        try {
            if (!codeReader) {
                // ZXing 디코더 객체 생성
                codeReader = new ZXing.BrowserMultiFormatReader();
            }

            // 고해상도 후면 카메라 제약 조건 지정
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920, max: 3840 },
                    height: { ideal: 1080, max: 2160 },
                    focusMode: { ideal: "continuous" }
                }
            };

            // 카메라 미디어 스트림 획득
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];

            // 비디오 로드 완료 후 실시간 디코딩 연결
            video.onloadedmetadata = () => {
                video.play();
                overlayMsg.style.display = 'none';
                laser.style.display = 'block';
                startBtn.innerText = "카메라 재시작";
                captureBtn.disabled = false;
                
                // 플래시 및 줌 지원 여부 체크
                checkCameraCapabilities();
                
                // 실시간 스캔 시작
                startContinuousDecode();
            };

        } catch (err) {
            console.error(err);
            showError("카메라 에러: " + (err.message || err.name));
            if (err.name === 'NotAllowedError') {
                resultText.innerText = "권한 거부됨: 브라우저/시스템 설정에서 카메라 허용이 필요합니다.";
            } else {
                resultText.innerText = "카메라를 시작하지 못했습니다.";
            }
        }
    }

    // 카메라 플래시/줌 기능 지원 여부 확인
    function checkCameraCapabilities() {
        if (!videoTrack) return;
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

        if (capabilities.torch) {
            torchBtn.disabled = false;
        }
        if (capabilities.zoom) {
            zoomRange.disabled = false;
            zoomRange.min = capabilities.zoom.min || 1;
            zoomRange.max = capabilities.zoom.max || 5;
            zoomRange.step = capabilities.zoom.step || 0.1;
        }
    }

    // 실시간 비디오 프레임 스캔
    function startContinuousDecode() {
        if (isScanning) return;
        isScanning = true;

        codeReader.decodeFromVideoElement(video, (result, err) => {
            if (result) {
                // 인식 성공!
                onScanSuccess(result.getText());
            }
        });
    }

    // 📸 수동 촬영 버튼 클릭 시 (Contrast 전처리 적용하여 고화질 스캔)
    async function manualCaptureAndScan() {
        if (!video.videoWidth) return;

        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // 현재 비디오 프레임 그린 후 명암 처리 (흑백/대비 강화)
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Canvas의 이미지를 ZXing으로 디코딩 시도
        try {
            const imgUrl = canvas.toDataURL('image/png');
            const img = new Image();
            img.src = imgUrl;
            img.onload = async () => {
                try {
                    const result = await codeReader.decodeFromImageElement(img);
                    if (result) {
                        onScanSuccess(result.getText());
                    }
                } catch (e) {
                    resultText.innerText = "촬영본에서 바코드를 인식하지 못했습니다. 더 가깝게 맞춰보세요.";
                }
            };
        } catch (e) {
            console.error(e);
        }
    }

    // 바코드 인식 성공 시 동작 (진동 + 소리 피드백)
    function onScanSuccess(decodedText) {
        resultText.innerText = decodedText;
        
        // 햅틱 진동 피드백 (지원 디바이스)
        if (navigator.vibrate) {
            navigator.vibrate(100);
        }
    }

    // 플래시 토글
    async function toggleTorch() {
        if (!videoTrack) return;
        torchState = !torchState;
        try {
            await videoTrack.applyConstraints({
                advanced: [{ torch: torchState }]
            });
            torchBtn.innerText = torchState ? "끄기" : "켜기";
        } catch (e) {
            console.error("Torch 에러:", e);
        }
    }

    // 줌 조절
    async function setZoom(val) {
        if (!videoTrack) return;
        try {
            await videoTrack.applyConstraints({
                advanced: [{ zoom: parseFloat(val) }]
            });
        } catch (e) {
            console.error("Zoom 에러:", e);
        }
    }
</script>
</body>
</html>
