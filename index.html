
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fa">
  <title>재고조사 카메라 스캔버젼 v.3</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f4f6fa;
      --text: #172033;
      --muted: #697386;
      --border: #dce2ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      font-size: 14px;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      min-height: 40px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled { opacity: .45; }

    .app { width: 100%; max-width: 620px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    h1 { font-size: 21px; margin: 0; }
    .subheading { margin-top: 2px; color: var(--muted); font-size: 11px; }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 8px;
      box-shadow: 0 1px 5px rgba(25,40,70,.03);
    }

    .section-title { font-size: 16px; font-weight: 800; margin-bottom: 9px; }

    .progress {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-bottom: 9px;
    }

    .progress-step { height: 4px; border-radius: 10px; background: #e1e6ef; }
    .progress-step.active { background: var(--primary); }
    .step-label { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
    label { display: block; font-weight: 700; margin-bottom: 5px; }

    input {
      width: 100%;
      min-width: 0;
      height: 43px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      padding: 0 10px;
      outline: none;
      color: var(--text);
      font-size: 16px;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37,99,235,.1);
    }

    .input-row { display: flex; gap: 6px; }
    .input-row input { flex: 1; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e9eef7; color: #24334d; }
    .btn-outline { background: white; color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .full { width: 100%; }
    .button-row { display: flex; gap: 7px; margin-top: 9px; }
    .button-row > button { flex: 1; }
    .hint { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.4; }

    .current-location {
      padding: 7px 9px;
      background: #eff6ff;
      border-radius: 8px;
      margin-bottom: 9px;
      font-size: 12px;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .camera-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #111827;
      display: none;
      margin-top: 9px;
    }

    .camera-container.visible { display: block; }
    #video { display: block; width: 100%; height: 100%; object-fit: cover; }

    .scan-frame {
      position: absolute;
      width: 88%;
      height: 34%;
      left: 6%;
      top: 33%;
      border: 2px solid #00e676;
      border-radius: 6px;
      box-shadow: 0 0 0 999px rgba(0,0,0,.15);
      pointer-events: none;
    }

    .scan-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 5px;
      text-align: center;
      color: white;
      font-size: 10px;
      text-shadow: 0 1px 4px black;
      pointer-events: none;
    }

    .camera-status { color: var(--muted); font-size: 11px; margin-top: 6px; min-height: 15px; line-height: 1.4; }

    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .record-header h2 { margin: 0; font-size: 15px; }

    .count-badge {
      background: #e8efff;
      color: #1d4ed8;
      border-radius: 20px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
    }

    .empty { padding: 14px 8px; text-align: center; color: var(--muted); font-size: 12px; }

    /* 조사 내역: 두 줄로 표시 */
    .record {
      padding: 6px 0;
      border-bottom: 1px solid #e8ecf3;
    }

    .record:last-child { border-bottom: 0; }

    .record-line {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      min-height: 19px;
    }

    .record-line-one { margin-bottom: 3px; }

    .record-time {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .record-location {
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
      min-width: 0;
      flex: 1;
    }

    .record-barcode {
      font-size: 11px;
      overflow-wrap: anywhere;
      min-width: 0;
      flex: 1;
      line-height: 1.3;
    }

    .record-qty {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .qty-tag {
      background: #f0f3f8;
      border-radius: 5px;
      padding: 3px 5px;
      font-size: 10px;
      white-space: nowrap;
    }

    .delete-one {
      min-height: 25px;
      padding: 3px 6px;
      background: #fff1f2;
      color: #be123c;
      font-size: 10px;
      flex-shrink: 0;
    }

    .small { min-height: 34px; font-size: 12px; padding: 6px 9px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15,23,42,.55);
    }

    .modal-backdrop.visible { display: flex; }

    .modal {
      width: 100%;
      max-width: 380px;
      background: white;
      border-radius: 14px;
      padding: 17px;
      box-shadow: 0 12px 40px rgba(0,0,0,.2);
    }

    .modal h2 { font-size: 18px; margin: 0 0 7px; }
    .modal p { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .detected-value {
      background: #f0f5ff;
      border: 1px solid #d6e4ff;
      padding: 11px;
      border-radius: 9px;
      font-size: 18px;
      font-weight: 800;
      overflow-wrap: anywhere;
      margin: 12px 0;
    }

    .hidden { display: none !important; }

    .footer-note {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
      text-align: center;
      padding: 3px 5px 8px;
    }

    @media (max-width: 380px) {
      body { padding: 6px; }
      .card { padding: 9px; }
      h1 { font-size: 19px; }
      .camera-container { max-height: 190px; }
      .record-qty { gap: 3px; }
      .qty-tag { padding: 3px 4px; font-size: 9px; }
      .record-barcode { font-size: 10px; }
    }
  </style>
</head>

<body>
<main class="app">
  <header>
    <div>
      <h1>📦 재고조사 카메라 스캔버젼 v.3</h1>
      <div class="subheading">바코드 스캔 · 수량 입력 · CSV 저장</div>
    </div>
    <button id="downloadTop" class="btn-secondary small">CSV 저장</button>
  </header>

  <section class="card">
    <div class="progress">
      <div class="progress-step active"></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
    </div>

    <div class="step-label" id="stepLabel">1 / 5 단계</div>
    <div class="section-title" id="stepTitle">조사 위치 입력</div>

    <div id="locationStep">
      <label for="locationInput">위치 / 로케이션</label>
      <div class="input-row">
        <input id="locationInput" placeholder="예: A-01-01" autocomplete="off">
        <button id="scanLocationBtn" class="btn-secondary">▦ 스캔</button>
      </div>
      <div class="hint">같은 위치면 그대로 진행하고, 다른 위치면 수정하세요.</div>
      <button id="locationNextBtn" class="btn-primary full" style="margin-top:9px">위치 확인 · 다음</button>
    </div>

    <div id="barcodeStep" class="hidden">
      <div class="current-location">현재 위치: <strong id="currentLocationText"></strong></div>
      <label for="barcodeInput">상품 바코드</label>
      <div class="input-row">
        <input id="barcodeInput" placeholder="바코드를 입력하거나 스캔하세요" autocomplete="off">
        <button id="scanBarcodeBtn" class="btn-primary">▦ 스캔</button>
      </div>
      <div class="hint">바코드 스캔 후 인식 결과를 확인하세요.</div>
      <div class="button-row">
        <button id="barcodeBackBtn" class="btn-outline">이전</button>
        <button id="barcodeNextBtn" class="btn-primary">바코드 확인 · 다음</button>
      </div>
    </div>

    <div id="quantityStep" class="hidden">
      <div class="current-location">
        위치: <strong id="quantityLocationText"></strong><br>
        바코드: <strong id="quantityBarcodeText"></strong>
      </div>

      <div id="packField">
        <label for="packInput">입수 (박스당 낱개 수량)</label>
        <input id="packInput" type="number" min="1" step="1" inputmode="numeric" placeholder="예: 12">
      </div>

      <div id="boxField" class="hidden">
        <label for="boxInput">박스 수량</label>
        <input id="boxInput" type="number" min="0" step="1" inputmode="numeric" placeholder="예: 5">
      </div>

      <div id="eachField" class="hidden">
        <label for="eachInput">낱개 수량</label>
        <input id="eachInput" type="number" min="0" step="1" inputmode="numeric" placeholder="예: 3">
      </div>

      <div class="button-row">
        <button id="backBtn" class="btn-outline">이전</button>
        <button id="quantityNextBtn" class="btn-primary">다음</button>
      </div>
    </div>

    <div id="cameraContainer" class="camera-container">
      <video id="video" autoplay muted playsinline></video>
      <div class="scan-frame"></div>
      <div class="scan-caption">바코드를 초록색 프레임 안에 맞춰주세요</div>
    </div>

    <div id="cameraStatus" class="camera-status"></div>

    <div id="cameraButtons" class="button-row hidden">
      <button id="retryScanBtn" class="btn-secondary">↻ 다시 스캔</button>
      <button id="stopScanBtn" class="btn-outline">카메라 종료</button>
    </div>
  </section>

  <section class="card">
    <div class="record-header">
      <h2>📋 조사 내역</h2>
      <span id="recordCount" class="count-badge">0건</span>
    </div>

    <div id="recordsList"><div class="empty">아직 등록된 내역이 없습니다.</div></div>

    <div class="button-row">
      <button id="downloadBtn" class="btn-primary">CSV 다운로드</button>
      <button id="clearBtn" class="btn-danger">전체 삭제</button>
    </div>
  </section>

  <div class="footer-note">조사 내역은 현재 브라우저에 유지됩니다. 작업 후 CSV로 저장하세요.</div>
</main>

<div id="scanModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle">인식 결과 확인</h2>
    <p id="modalDescription">아래 내용이 맞는지 확인해 주세요.</p>
    <div id="detectedValue" class="detected-value"></div>
    <div class="button-row">
      <button id="modalRetryBtn" class="btn-secondary">다시 스캔</button>
      <button id="modalAcceptBtn" class="btn-primary">맞습니다 · 다음</button>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  const state = {
    step: 0,
    location: "",
    barcode: "",
    pack: "",
    boxes: "",
    each: "",
    records: [],
    scanPurpose: "",
    pendingValue: "",
    reader: null,
    controls: null,
    stream: null,
    scanTimeout: null,
    scanSession: 0,
    scanHandled: false
  };

  const stepTitles = [
    "조사 위치 입력",
    "상품 바코드 스캔",
    "입수 입력",
    "박스 수량 입력",
    "낱개 수량 입력"
  ];

  function showMessage(message) {
    $("cameraStatus").textContent = message;
  }

  function hideCamera() {
    state.scanSession++;

    if (state.scanTimeout) {
      clearTimeout(state.scanTimeout);
      state.scanTimeout = null;
    }

    try {
      if (state.controls && typeof state.controls.stop === "function") {
        state.controls.stop();
      }
    } catch (e) {}

    state.controls = null;

    try {
      if (state.reader && typeof state.reader.reset === "function") {
        state.reader.reset();
      }
    } catch (e) {}

    if (state.stream) {
      state.stream.getTracks().forEach(track => track.stop());
      state.stream = null;
    }

    const video = $("video");
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }

    $("cameraContainer").classList.remove("visible");
    $("cameraButtons").classList.add("hidden");
  }

  function updateProgress() {
    document.querySelectorAll(".progress-step").forEach((el, index) => {
      el.classList.toggle("active", index <= state.step);
    });
    $("stepLabel").textContent = (state.step + 1) + " / 5 단계";
    $("stepTitle").textContent = stepTitles[state.step];
  }

  function renderStep() {
    updateProgress();

    $("locationStep").classList.toggle("hidden", state.step !== 0);
    $("barcodeStep").classList.toggle("hidden", state.step !== 1);
    $("quantityStep").classList.toggle("hidden", state.step < 2);

    $("currentLocationText").textContent = state.location;
    $("quantityLocationText").textContent = state.location;
    $("quantityBarcodeText").textContent = state.barcode;

    $("packField").classList.toggle("hidden", state.step !== 2);
    $("boxField").classList.toggle("hidden", state.step !== 3);
    $("eachField").classList.toggle("hidden", state.step !== 4);

    $("backBtn").textContent = state.step === 2 ? "바코드로 돌아가기" : "이전";
    $("quantityNextBtn").textContent = state.step === 4 ? "등록 완료" : "다음";

    if (state.step >= 2) hideCamera();
  }

  function goToStep(step) {
    state.step = Math.max(0, Math.min(4, step));
    renderStep();

    if (state.step === 0) $("locationInput").focus();
    else if (state.step === 1) $("barcodeInput").focus();
    else if (state.step === 2) $("packInput").focus();
    else if (state.step === 3) $("boxInput").focus();
    else $("eachInput").focus();
  }

  function openScanModal(value, purpose) {
    state.pendingValue = String(value);
    state.scanPurpose = purpose;

    $("detectedValue").textContent = state.pendingValue;
    $("modalTitle").textContent = purpose === "location" ? "위치 인식 결과" : "바코드 인식 결과";
    $("modalDescription").textContent = purpose === "location" ? "이 위치가 맞습니까?" : "인식한 바코드가 맞습니까?";
    $("scanModalBackdrop").classList.add("visible");
    $("cameraButtons").classList.add("hidden");
  }

  function closeScanModal() {
    $("scanModalBackdrop").classList.remove("visible");
  }

  async function startScan(purpose) {
    hideCamera();
    state.scanPurpose = purpose;
    state.scanHandled = false;
    const session = state.scanSession;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMessage("카메라를 사용할 수 없습니다. Safari에서 HTTPS 주소로 열어주세요.");
      return;
    }

    if (typeof ZXingBrowser === "undefined" || !ZXingBrowser.BrowserMultiFormatReader) {
      showMessage("바코드 인식 라이브러리를 불러올 수 없습니다. 인터넷 연결을 확인하세요.");
      return;
    }

    try {
      showMessage("카메라를 시작하는 중입니다…");
      $("cameraContainer").classList.add("visible");
      $("cameraButtons").classList.remove("hidden");

      const video = $("video");
      state.reader = new ZXingBrowser.BrowserMultiFormatReader();

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      state.controls = await state.reader.decodeFromConstraints(
        constraints,
        video,
        (result, error) => {
          if (session !== state.scanSession || state.scanHandled) return;

          if (result) {
            const text = result.getText ? result.getText() : String(result);

            if (text && text.trim()) {
              state.scanHandled = true;
              hideCamera();
              showMessage("바코드를 인식했습니다.");
              openScanModal(text.trim(), purpose);
            }
          }
        }
      );

      if (session !== state.scanSession) return;
      if (video.srcObject) state.stream = video.srcObject;

      showMessage("바코드를 초록색 프레임 안에 맞춰주세요.");

      state.scanTimeout = setTimeout(() => {
        if (session !== state.scanSession || state.scanHandled) return;
        hideCamera();
        showMessage("스캔 시간이 종료되었습니다. 다시 스캔을 눌러주세요.");
      }, 30000);

    } catch (error) {
      hideCamera();
      console.error("Camera scan error:", error);

      let message = "카메라를 시작하지 못했습니다.";
      if (error && error.name === "NotAllowedError") {
        message = "카메라 권한이 차단되어 있습니다. Safari 설정에서 카메라 권한을 허용해주세요.";
      } else if (error && error.name === "NotFoundError") {
        message = "사용할 수 있는 카메라를 찾지 못했습니다.";
      } else if (error && error.name === "NotReadableError") {
        message = "카메라가 다른 앱에서 사용 중일 수 있습니다. 다른 앱을 닫고 다시 시도하세요.";
      }
      showMessage(message);
    }
  }

  function acceptScan() {
    const value = state.pendingValue.trim();
    const purpose = state.scanPurpose;
    closeScanModal();
    if (!value) return;

    if (purpose === "location") {
      state.location = value;
      $("locationInput").value = value;
      showMessage("위치가 확인되었습니다.");
      goToStep(1);
    } else {
      state.barcode = value;
      $("barcodeInput").value = value;
      showMessage("바코드가 확인되었습니다.");
      goToStep(2);
    }

    state.pendingValue = "";
  }

  function continueLocation() {
    const value = $("locationInput").value.trim();
    if (!value) {
      alert("조사 위치를 입력하거나 스캔해주세요.");
      $("locationInput").focus();
      return;
    }
    state.location = value;
    goToStep(1);
  }

  function continueBarcode() {
    const value = $("barcodeInput").value.trim();
    if (!value) {
      alert("상품 바코드를 입력하거나 스캔해주세요.");
      $("barcodeInput").focus();
      return;
    }
    state.barcode = value;
    goToStep(2);
  }

  function readInteger(id, label, minimum) {
    const raw = $(id).value.trim();
    if (raw === "") {
      alert(label + "을(를) 입력해주세요.");
      $(id).focus();
      return null;
    }

    const value = Number(raw);
    if (!Number.isInteger(value) || value < minimum) {
      alert(label + "은(는) " + minimum + " 이상의 정수로 입력해주세요.");
      $(id).focus();
      return null;
    }
    return value;
  }

  function continueQuantity() {
    if (state.step === 2) {
      const value = readInteger("packInput", "입수", 1);
      if (value === null) return;
      state.pack = value;
      goToStep(3);
      return;
    }

    if (state.step === 3) {
      const value = readInteger("boxInput", "박스 수량", 0);
      if (value === null) return;
      state.boxes = value;
      goToStep(4);
      return;
    }

    if (state.step === 4) {
      const value = readInteger("eachInput", "낱개 수량", 0);
      if (value === null) return;

      state.each = value;
      const total = (Number(state.pack) * Number(state.boxes)) + value;

      state.records.unshift({
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
        time: new Date().toLocaleTimeString("ko-KR", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }),
        location: state.location,
        barcode: state.barcode,
        pack: Number(state.pack),
        boxes: Number(state.boxes),
        each: value,
        total
      });

      renderRecords();

      // 품목 정보는 초기화하고 로케이션은 유지
      state.barcode = "";
      state.pack = "";
      state.boxes = "";
      state.each = "";

      $("barcodeInput").value = "";
      $("packInput").value = "";
      $("boxInput").value = "";
      $("eachInput").value = "";
      $("locationInput").value = state.location;

      // 다음 품목은 로케이션 입력 화면부터
      goToStep(0);
      showMessage("등록 완료! 같은 위치면 그대로 진행하고, 다른 위치면 로케이션을 수정하세요.");
    }
  }

  function renderRecords() {
    const list = $("recordsList");
    $("recordCount").textContent = state.records.length + "건";

    if (!state.records.length) {
      list.innerHTML = '<div class="empty">아직 등록된 내역이 없습니다.</div>';
      return;
    }

    list.replaceChildren();

    state.records.forEach(record => {
      const card = document.createElement("div");
      card.className = "record";

      // 1행: 시간 / 로케이션 / 삭제
      const line1 = document.createElement("div");
      line1.className = "record-line record-line-one";

      const time = document.createElement("span");
      time.className = "record-time";
      time.textContent = record.time;

      const location = document.createElement("span");
      location.className = "record-location";
      location.textContent = record.location;

      const del = document.createElement("button");
      del.className = "delete-one";
      del.textContent = "삭제";
      del.addEventListener("click", () => {
        if (!confirm("이 내역을 삭제할까요?")) return;
        state.records = state.records.filter(item => item.id !== record.id);
        renderRecords();
      });

      line1.append(time, location, del);

      // 2행: 바코드 / 입수 / 박스 / 낱개
      const line2 = document.createElement("div");
      line2.className = "record-line";

      const barcode = document.createElement("span");
      barcode.className = "record-barcode";
      barcode.textContent = record.barcode;

      const qty = document.createElement("div");
      qty.className = "record-qty";

      [
        "입수 " + record.pack,
        "박스 " + record.boxes,
        "낱개 " + record.each
      ].forEach(text => {
        const tag = document.createElement("span");
        tag.className = "qty-tag";
        tag.textContent = text;
        qty.appendChild(tag);
      });

      line2.append(barcode, qty);
      card.append(line1, line2);
      list.appendChild(card);
    });
  }

  function downloadCSV() {
    if (!state.records.length) {
      alert("다운로드할 조사 내역이 없습니다.");
      return;
    }

    const headers = ["조사시간", "위치", "바코드", "입수", "박스수량", "낱개수량", "총낱개수량"];
    const rows = state.records.map(r => [
      r.time, r.location, r.barcode, r.pack, r.boxes, r.each, r.total
    ]);

    const escapeCSV = value => {
      let text = String(value ?? "");
      if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    };

    const csv = "\uFEFF" + [headers, ...rows]
      .map(row => row.map(escapeCSV).join(","))
      .join("\r\n");

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "재고조사_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  $("locationNextBtn").addEventListener("click", continueLocation);
  $("barcodeNextBtn").addEventListener("click", continueBarcode);
  $("quantityNextBtn").addEventListener("click", continueQuantity);

  $("scanLocationBtn").addEventListener("click", () => startScan("location"));
  $("scanBarcodeBtn").addEventListener("click", () => startScan("barcode"));

  // 바코드 화면에서 이전을 누르면 로케이션 입력으로 돌아감
  $("barcodeBackBtn").addEventListener("click", () => {
    $("locationInput").value = state.location;
    goToStep(0);
  });

  $("retryScanBtn").addEventListener("click", () => startScan(state.scanPurpose));
  $("stopScanBtn").addEventListener("click", () => {
    hideCamera();
    showMessage("카메라가 종료되었습니다.");
  });

  $("modalRetryBtn").addEventListener("click", () => {
    const purpose = state.scanPurpose;
    closeScanModal();
    startScan(purpose);
  });

  $("modalAcceptBtn").addEventListener("click", acceptScan);

  $("backBtn").addEventListener("click", () => {
    if (state.step === 2) goToStep(1);
    else goToStep(state.step - 1);
  });

  $("downloadBtn").addEventListener("click", downloadCSV);
  $("downloadTop").addEventListener("click", downloadCSV);

  $("clearBtn").addEventListener("click", () => {
    if (!state.records.length) {
      alert("삭제할 내역이 없습니다.");
      return;
    }
    if (!confirm("등록된 내역을 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.")) return;
    state.records = [];
    renderRecords();
  });

  $("locationInput").addEventListener("keydown", e => {
    if (e.key === "Enter") continueLocation();
  });

  $("barcodeInput").addEventListener("keydown", e => {
    if (e.key === "Enter") continueBarcode();
  });

  ["packInput", "boxInput", "eachInput"].forEach(id => {
    $(id).addEventListener("keydown", e => {
      if (e.key === "Enter") continueQuantity();
    });
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) hideCamera();
  });

  renderStep();
  renderRecords();
</script>
</body>
</html>
