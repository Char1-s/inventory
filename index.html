<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카메라 재고조사</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#172033;background:#f3f5f8}
*{box-sizing:border-box} body{margin:0;min-height:100vh}
header{background:#16324f;color:white;padding:16px 18px;font-size:20px;font-weight:800}
#count{float:right;font-size:14px;background:#ffffff24;padding:5px 9px;border-radius:20px}
main{max-width:520px;margin:auto;padding:18px 16px 110px}
.progress{display:flex;gap:5px;margin:4px 0 20px}.progress span{height:5px;background:#d4dbe5;border-radius:8px;flex:1}.progress span.on{background:#2474e5}
.card,.records{background:white;border-radius:18px;padding:24px 18px;box-shadow:0 4px 18px #1020400d}
.step{font-size:13px;color:#2474e5;font-weight:800;margin-bottom:8px}h1{font-size:28px;margin:0 0 8px}
.hint{color:#657187;font-size:14px;line-height:1.5;margin:0 0 22px}
input{width:100%;height:62px;border:2px solid #d9e0ea;border-radius:12px;padding:12px;font-size:24px;text-align:center;background:white;color:#172033}
input:focus{outline:3px solid #bfdbfe;border-color:#2474e5}
.btn{border:0;border-radius:12px;min-height:54px;padding:12px 16px;font-size:17px;font-weight:750;cursor:pointer}
.primary{background:#1769e0;color:white;width:100%;margin-top:16px}.secondary{background:#e9eef5;color:#23344d;width:100%;margin-top:10px}
.hidden{display:none!important}#reader{width:100%;margin-top:16px;overflow:hidden;border-radius:12px}
.cameraNote{font-size:12px;color:#657187;line-height:1.5;margin-top:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid #e1e6ee;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bottom button{max-width:520px;flex:1}.status{font-size:14px;color:#526078;margin-top:14px;text-align:center}
.records{margin-top:18px;padding:14px}.records h2{font-size:16px;margin:0 0 8px}
.recordline{font-size:13px;color:#59667a;padding:8px 0;border-bottom:1px solid #edf0f4;overflow-wrap:anywhere}
#toast{font-size:14px;color:#12603b;background:#e7f8ee;border-radius:10px;padding:10px;margin-top:12px;display:none}
</style>
</head>
<body>
<header>카메라 재고조사 <span id="count">저장 0건</span></header>
<main>
<div class="progress" id="progress"><span class="on"></span><span></span><span></span><span></span><span></span></div>
<section class="card">
  <div class="step" id="stepLabel">1 / 5 단계</div>
  <h1 id="title">로케이션 스캔</h1>
  <p class="hint" id="hint">카메라로 로케이션 바코드를 비춰 주세요.</p>
  <input id="entry" autocomplete="off" autocapitalize="off" aria-label="입력값">
  <button class="btn primary" id="scanBtn" type="button">카메라로 스캔</button>
  <div id="reader" class="hidden"></div>
  <div class="cameraNote" id="cameraNote">카메라 사용은 HTTPS 주소에서 지원됩니다. 카메라 권한을 허용해 주세요.</div>
  <button class="btn secondary hidden" id="manualNext" type="button">다음</button>
  <div id="toast"></div>
</section>
<section class="records">
<h2>최근 저장 내역</h2><div id="recent"><div class="recordline">아직 저장된 데이터가 없습니다.</div></div>
</section>
<div class="status" id="status">저장 데이터는 이 브라우저에 임시 보관됩니다.</div>
</main>
<div class="bottom">
<button class="btn secondary" id="resetFlow" type="button">처음 단계로</button>
<button class="btn primary" id="downloadBtn" type="button">CSV 다운로드</button>
</div>
<script>
(() => {
 const STORAGE_KEY="inventoryData";
 const INIT_KEY="inventoryCameraAppInitialized_v2";
 if(!localStorage.getItem(INIT_KEY)){
   localStorage.removeItem(STORAGE_KEY);
   localStorage.setItem(INIT_KEY,"Y");
 }
 const steps=[
  {key:"location",title:"로케이션 스캔",hint:"카메라로 로케이션 바코드를 비춰 주세요.",scan:true,placeholder:"로케이션 코드"},
  {key:"barcode",title:"상품코드 스캔",hint:"상품 바코드를 카메라로 비춰 주세요.",scan:true,placeholder:"상품코드"},
  {key:"packQty",title:"입수 입력",hint:"박스 1개에 들어 있는 수량을 입력하세요.",placeholder:"입수",numeric:true},
  {key:"boxQty",title:"박스수 입력",hint:"박스 수량을 입력하세요.",placeholder:"박스수",numeric:true},
  {key:"each",title:"낱개수 입력",hint:"낱개 수량을 입력하세요. Enter 또는 다음 버튼으로 저장합니다.",placeholder:"낱개수",numeric:true}
 ];
 let records=[];
 try{records=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){records=[]}
 if(!Array.isArray(records))records=[];
 let index=0;
 let current={location:"",barcode:"",packQty:"",boxQty:"",each:""};
 let scanner=null,scanning=false,lastScanAt=0;
 const $=id=>document.getElementById(id), entry=$("entry");
 function updateCount(){$("count").textContent="저장 "+records.length+"건"}
 function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records));updateCount();renderRecent()}
 function renderRecent(){
  const el=$("recent");el.replaceChildren();
  if(!records.length){const d=document.createElement("div");d.className="recordline";d.textContent="아직 저장된 데이터가 없습니다.";el.appendChild(d);return}
  records.slice(-3).reverse().forEach(r=>{const d=document.createElement("div");d.className="recordline";d.textContent=`${r.location} · ${r.barcode} · 입수 ${r.packQty} · 박스수 ${r.boxQty} · 낱개수 ${r.each}`;el.appendChild(d)})
 }
 function showStep(i){
  stopScanner();index=i;const s=steps[i];
  $("stepLabel").textContent=`${i+1} / ${steps.length} 단계`;
  $("title").textContent=s.title;$("hint").textContent=s.hint;
  $("progress").querySelectorAll("span").forEach((el,n)=>el.classList.toggle("on",n<=i));
  entry.value=current[s.key]||"";entry.placeholder=s.placeholder;
  entry.type=s.numeric?"number":"text";entry.inputMode=s.numeric?"numeric":"text";
  $("scanBtn").classList.toggle("hidden",!s.scan);$("manualNext").classList.toggle("hidden",!!s.scan);
  $("cameraNote").classList.toggle("hidden",!s.scan);$("reader").classList.add("hidden");$("toast").style.display="none";
  setTimeout(()=>entry.focus(),100);
 }
 function stopScanner(){
  if(scanner&&scanning){const old=scanner;scanning=false;old.stop().catch(()=>{}).finally(()=>{try{old.clear()}catch(e){}})}
  else if(scanner){try{scanner.clear()}catch(e){}}
  scanner=null;$("reader").classList.add("hidden");$("scanBtn").textContent="카메라로 스캔";
 }
 async function startScanner(){
  if(typeof Html5Qrcode==="undefined"){alert("스캔 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");return}
  $("reader").classList.remove("hidden");$("scanBtn").textContent="카메라 실행 중…";
  try{
   scanner=new Html5Qrcode("reader");
   const config={fps:10,qrbox:{width:Math.min(300,window.innerWidth-100),height:130},aspectRatio:1.5,
    formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR,Html5QrcodeSupportedFormats.QR_CODE]};
   await scanner.start({facingMode:"environment"},config,text=>{
    const now=Date.now();if(now-lastScanAt<1200)return;lastScanAt=now;
    entry.value=text;current[steps[index].key]=text;stopScanner();nextStep();
   },()=>{});
   scanning=true;$("scanBtn").textContent="카메라 스캔 중";
  }catch(err){stopScanner();alert("카메라를 시작하지 못했습니다. 카메라 권한을 허용하고 HTTPS 주소에서 열어 주세요.\n"+(err?.message||""))}
 }
 function nextStep(){
  const s=steps[index],value=entry.value.trim();
  if(!value){alert(s.title+" 값을 입력하거나 스캔해 주세요.");entry.focus();return}
  current[s.key]=value;
  if(index<steps.length-1)showStep(index+1);else saveRecord();
 }
 function saveRecord(){
  records.push({...current});persist();
  current={location:"",barcode:"",packQty:"",boxQty:"",each:""};
  $("status").textContent="저장 완료. 다음 로케이션을 스캔하세요.";
  showStep(0);
 }
 function csvCell(v){return '"'+String(v??"").replace(/"/g,'""')+'"'}
 function downloadCSV(){
  if(!records.length){alert("다운로드할 데이터가 없습니다.");return}
  if(!confirm("CSV를 다운로드하고 나면 조사 데이터가 삭제됩니다. 계속할까요?"))return;
  const rows=[["로케이션","상품코드","입수","박스수","낱개수"],...records.map(r=>[r.location,r.barcode,r.packQty,r.boxQty,r.each])];
  const blob=new Blob(["\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob),a=document.createElement("a"),d=new Date(),p=n=>String(n).padStart(2,"0");
  a.href=url;a.download=`재고조사_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>{URL.revokeObjectURL(url);records=[];localStorage.removeItem(STORAGE_KEY);updateCount();renderRecent();$("status").textContent="CSV 다운로드 후 조사 데이터가 초기화되었습니다.";showStep(0)},800);
 }
 $("scanBtn").addEventListener("click",startScanner);
 $("manualNext").addEventListener("click",nextStep);
 entry.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();nextStep()}});
 $("resetFlow").addEventListener("click",()=>{if(confirm("입력 중인 미저장 항목을 지우고 로케이션 단계로 돌아갈까요? 저장된 데이터는 유지됩니다.")){current={location:"",barcode:"",packQty:"",boxQty:"",each:""};showStep(0)}});
 $("downloadBtn").addEventListener("click",downloadCSV);
 window.addEventListener("beforeunload",stopScanner);
 updateCount();renderRecent();showStep(0);
})();
</script>
</body>
</html>
